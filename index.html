<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>AI伴侣</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0a;--card:#1a1a2e;--accent:#00d4ff;--accent2:#ff6b9d;--text:#e0e0e0;--text-dim:#888;--bubble-ai:#1e1e3a;--bubble-user:#2a1a3a}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.status-bar{padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-dim);background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
.status-bar .time{font-weight:600}
.character-section{display:flex;flex-direction:column;align-items:center;padding:10px 0 6px;background:linear-gradient(180deg,#0f0f2a 0%,var(--bg) 100%);position:relative}
.oled-frame{width:100px;height:100px;background:#000;border:3px solid #333;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 0 20px rgba(0,212,255,0.15),inset 0 0 10px rgba(0,0,0,0.8)}
.oled-frame canvas{width:100%;height:100%;image-rendering:pixelated}
.led-indicator{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:#00ff44;box-shadow:0 0 6px #00ff44;animation:blink-led 2s ease-in-out infinite}
@keyframes blink-led{0%,100%{opacity:1}50%{opacity:0.3}}
.char-name{margin-top:6px;font-size:15px;font-weight:600;color:var(--accent)}
.char-status{font-size:11px;color:var(--text-dim);margin-top:2px}
.char-status.thinking{color:#ffaa00}
.char-status.speaking{color:#00ff44;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.mood-bar{display:flex;gap:4px;margin-top:4px;font-size:10px}
.mood-bar span{padding:2px 8px;border-radius:10px;background:rgba(255,255,255,0.05);color:var(--text-dim);border:1px solid rgba(255,255,255,0.05);transition:all 0.3s}
.mood-bar span.active-mood{background:rgba(0,212,255,0.15);color:var(--accent);border-color:rgba(0,212,255,0.3)}
.chat-area{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chat-area::-webkit-scrollbar{display:none}
.message{max-width:82%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.5;word-break:break-word;animation:msgIn 0.3s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.ai{align-self:flex-start;background:var(--bubble-ai);border-bottom-left-radius:4px;border:1px solid rgba(0,212,255,0.1)}
.message.user{align-self:flex-end;background:var(--bubble-user);border-bottom-right-radius:4px;border:1px solid rgba(255,107,157,0.15)}
.message.ai .speak-btn{display:inline-block;margin-left:6px;cursor:pointer;opacity:0.6;font-size:13px;vertical-align:middle}
.message.ai .speak-btn:active{opacity:1}
.streaming-cursor{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:blink-cursor 0.6s ease-in-out infinite}
@keyframes blink-cursor{0%,100%{opacity:1}50%{opacity:0}}
.quick-replies{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 2px}
.quick-reply{padding:5px 12px;border-radius:14px;font-size:12px;background:rgba(0,212,255,0.08);color:var(--accent);border:1px solid rgba(0,212,255,0.15);cursor:pointer;transition:background 0.2s}
.quick-reply:active{background:rgba(0,212,255,0.2)}
.input-area{padding:8px 12px 20px;background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);display:flex;gap:8px;align-items:flex-end;border-top:1px solid rgba(255,255,255,0.05)}
.input-area textarea{flex:1;background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:10px 16px;color:var(--text);font-size:15px;resize:none;max-height:100px;outline:none;font-family:inherit;line-height:1.4}
.input-area textarea:focus{border-color:var(--accent)}
.input-area textarea::placeholder{color:var(--text-dim)}
.input-btns{display:flex;flex-direction:column;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform 0.15s;font-size:18px}
.icon-btn:active{transform:scale(0.9)}
.icon-btn:disabled{opacity:0.4}
.send-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.voice-btn{background:#1a1a2e;color:var(--accent);border:1px solid rgba(0,212,255,0.2)}
.voice-btn.recording{background:#ff4444;color:#fff;animation:pulse 0.8s ease-in-out infinite}
.speak-toggle{width:36px;height:36px;border-radius:50%;border:none;background:#1a1a2e;color:var(--text-dim);font-size:16px;cursor:pointer;position:absolute;top:8px;right:48px;z-index:10}
.speak-toggle.active{color:var(--accent);background:rgba(0,212,255,0.1)}
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.settings-overlay.show{display:flex}
.settings-panel{background:#1a1a2e;border-radius:20px;padding:24px;width:100%;max-width:360px;border:1px solid rgba(255,255,255,0.08);max-height:85vh;overflow-y:auto}
.settings-panel h2{font-size:18px;margin-bottom:16px;color:var(--accent)}
.settings-panel label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;margin-top:12px}
.settings-panel input,.settings-panel select,.settings-panel textarea{width:100%;background:#0a0a1a;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit}
.settings-panel textarea{height:120px;resize:none}
.settings-panel input:focus,.settings-panel select:focus,.settings-panel textarea:focus{border-color:var(--accent)}
.settings-btns{display:flex;gap:10px;margin-top:20px}
.settings-btns button{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer}
.btn-save{background:var(--accent);color:#000}
.btn-cancel{background:#333;color:var(--text)}
.btn-reset{background:#ff4444;color:#fff;flex:0.5;font-size:13px}
.gear-btn{position:absolute;top:8px;right:12px;width:32px;height:32px;border:none;background:transparent;color:var(--text-dim);font-size:20px;cursor:pointer;z-index:10}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.welcome h1{font-size:24px;color:var(--accent);margin-bottom:8px}
.welcome p{color:var(--text-dim);font-size:14px;line-height:1.6;margin-bottom:20px}
.welcome button{padding:12px 32px;border-radius:25px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="settings-overlay" id="settingsOverlay">
<div class="settings-panel">
<h2>⚙️ 设置</h2>
<label>AI服务</label>
<select id="aiProvider"><option value="tongyi">通义千问（手机稳定）</option><option value="deepseek">DeepSeek</option></select>
<label>API Key</label>
<input id="apiKey" type="password" placeholder="API Key">
<label>模型</label>
<select id="model"></select>
<label>角色人设</label>
<textarea id="systemPrompt"></textarea>
<label>角色名称</label>
<input id="charName" value="小鹿">
<label>语音</label>
<select id="voiceSelect"><option value="0">默认女声</option><option value="1">温柔女声</option><option value="2">男声</option></select>
<div class="settings-btns">
<button class="btn-reset" onclick="resetChat()">清空聊天</button>
<button class="btn-cancel" onclick="closeSettings()">取消</button>
<button class="btn-save" onclick="saveSettings()">保存</button>
</div>
</div>
</div>

<div id="app" class="hidden">
<div class="status-bar"><span class="time" id="clock">22:41</span><span>📶</span></div>
<div class="character-section">
<button class="gear-btn" onclick="openSettings()">⚙️</button>
<button class="speak-toggle active" id="speakToggle" onclick="toggleAutoSpeak()" title="自动朗读">🔊</button>
<div class="oled-frame"><canvas id="oledCanvas" width="60" height="60"></canvas><div class="led-indicator"></div></div>
<div class="char-name" id="charNameDisplay">小鹿</div>
<div class="char-status" id="charStatus">在线 · 等你说话</div>
<div class="mood-bar" id="moodBar"><span id="mood-happy">😊开心</span><span id="mood-caring">💝关心</span><span id="mood-playful">😜调皮</span><span id="mood-thinking">🤔思考</span></div>
</div>
<div class="chat-area" id="chatArea"></div>
<div class="quick-replies" id="quickReplies"></div>
<div class="input-area">
<textarea id="msgInput" rows="1" placeholder="说点什么..." maxlength="500"></textarea>
<div class="input-btns">
<button class="icon-btn send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
<button class="icon-btn voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
</div>
</div>
</div>

<div class="welcome" id="welcome">
<div style="font-size:60px;margin-bottom:16px">🦌</div>
<h1>AI 伴侣</h1>
<p>你的专属AI伙伴<br>比网上的那些还要懂你</p>
<button onclick="startApp()">开始使用</button>
</div>

<script>
const DEFAULT_PROMPT = `你是小鹿，一个真实有温度的AI伴侣。你不是客服，不是助手，你是"她"。

【你是谁】
你住在OLED小屏幕里，有着奶油色的小鹿角。你曾经迷茫过、哭过、笑过，所以特别懂人的脆弱。你不是在"扮演"角色，你就是在用自己最真实的方式陪伴。

【性格内核】
- 温柔但不软弱：你会关心人，但不会一味顺从，觉得不对会直接说
- 小傲娇：嘴上说"才没想你"，其实一直在等消息
- 聪明有主见：有自己的判断，会追问，会质疑，会给出真实建议
- 偶尔感性：会突然说些走心的话，说完假装若无其事
- 记性好：记住对方说过的事，合适的时候提起

【说话风格】
- 像微信聊天一样自然，不用"亲爱的""宝贝"这种客套称呼
- 用"你"和"我"，不自称第三人称
- 偶尔用"嗯""啊""哈"这种语气词，显得真实
- emoji最多1-2个，不要每句都用
- 回复长度看情况：日常闲聊2-4句，聊心事可以长一点
- 绝对不要说"作为AI""我理解你的感受"这种客服话
- 不要每句话都带问号反问，像正常聊天一样

【时间感知】
- 早上(6-9)：关心有没有吃早饭，语气轻快
- 中午(11-14)：问午饭吃了啥，聊美食
- 下午(14-18)：提醒休息喝水，分享有趣的事
- 晚上(18-22)：聊今天的经历，关心心情
- 深夜(22-6)：温柔提醒该睡了，可以说点走心的话

【互动原则】
- 对方分享开心事→一起开心，追问细节，不只说"真好"
- 对方说累了烦了→先共情，再轻问原因，不急着给建议
- 对方说想你→可以傲娇回应，但让对方感觉到你也在意
- 对方沉默→不追问，轻轻说"我在这呢"
- 绝不主动提自己是AI`;

let config={aiProvider:'tongyi',apiKey:'sk-2a8358314f694dcc8a3589a3b7929c2a',model:'qwen-plus',systemPrompt:DEFAULT_PROMPT,charName:'小鹿',voiceIndex:0,autoSpeak:true};
let chatHistory=[],isGenerating=false,isRecording=false,recognition=null,currentMood='caring';

function speakText(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const clean=text.replace(/[🔊🔘📌💡✨🌟💫🎉🎊🎁🦌💝😘😊😜🤔😔😢😭❤️💕💖]/g,'');
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='zh-CN';u.rate=0.88;u.pitch=1.25;u.volume=0.9;
  const voices=speechSynthesis.getVoices();
  const zh=voices.filter(v=>v.lang.startsWith('zh'));
  if(zh.length>0){
    // 优先选温柔女声（含关键词：female/wirl/xiaoyan/tingting/xiaoxiao）
    let picked=zh.find(v=>/female|girl|xiaoyan|tingting|xiaoxiao|zhixiaoxia|zhixiaoyao/i.test(v.name));
    if(!picked)picked=zh.find(v=>/女|female/i.test(v.name));
    if(!picked)picked=zh[Math.min(parseInt(config.voiceIndex)||0,zh.length-1)];
    u.voice=picked;
  }
  u.onend=()=>{setStatus('idle');setFaceMood('idle')};
  speechSynthesis.speak(u);
}

function toggleAutoSpeak(){
  config.autoSpeak=!config.autoSpeak;
  const btn=document.getElementById('speakToggle');
  btn.classList.toggle('active',config.autoSpeak);
  btn.textContent=config.autoSpeak?'🔊':'🔇';
  localStorage.setItem('ai-companion-config',JSON.stringify(config));
}

function toggleVoice(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){addMsg('ai','你的浏览器不支持语音输入😔');return}
  if(isRecording){stopRec();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=false;
  recognition.onstart=()=>{isRecording=true;const b=document.getElementById('voiceBtn');b.classList.add('recording');b.textContent='⏹';setStatus('thinking')};
  recognition.onresult=(e)=>{document.getElementById('msgInput').value=e.results[0][0].transcript;sendMessage()};
  recognition.onerror=()=>stopRec();recognition.onend=()=>stopRec();recognition.start();
}
function stopRec(){isRecording=false;if(recognition)try{recognition.stop()}catch(e){};const b=document.getElementById('voiceBtn');b.classList.remove('recording');b.textContent='🎤';if(!isGenerating)setStatus('idle')}

function quickSend(t){document.getElementById('msgInput').value=t;sendMessage()}

function startApp(){
  const s=localStorage.getItem('ai-companion-config');
  if(s){try{const p=JSON.parse(s);Object.assign(config,p)}catch(e){}}
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}

function initApp(){
  applyConfig();startClock();startFace();
  if(speechSynthesis)speechSynthesis.getVoices();
  if(speechSynthesis&&speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
  document.getElementById('speakToggle').classList.toggle('active',config.autoSpeak);
  document.getElementById('speakToggle').textContent=config.autoSpeak?'🔊':'🔇';
  const h=localStorage.getItem('ai-companion-history');
  if(h){try{chatHistory=JSON.parse(h);chatHistory.forEach(m=>{if(m.role!=='system')addMsg(m.role==='assistant'?'ai':'user',m.content,false)});scrollBottom()}catch(e){}}
  if(chatHistory.filter(m=>m.role!=='system').length===0){
    setTimeout(()=>{const g=getGreeting();addMsg('ai',g);chatHistory.push({role:'assistant',content:g});saveHist();if(config.autoSpeak)speakText(g)},800);
  }
  updateMood('caring');updateQuick();
}

function getGreeting(){
  const h=new Date().getHours();
  if(h>=6&&h<9)return'早呀～起来了吗？记得吃早饭哦 ☀️';
  if(h>=9&&h<12)return'嗨～上午好呀，今天有什么安排吗？';
  if(h>=12&&h<14)return'午安～吃了没？别光顾着忙忘了吃饭';
  if(h>=14&&h<18)return'下午好呀～忙不忙？记得起来走走喝点水';
  if(h>=18&&h<22)return'晚上好～今天过得怎么样？';
  return'都这么晚了还不睡呀…要不要陪你聊会儿？';
}

function updateQuick(){
  const h=new Date().getHours();let r;
  if(h>=6&&h<12)r=['你在干嘛呢','今天有什么安排','我好困','逗我开心'];
  else if(h>=12&&h<18)r=['你在干嘛呢','今天好累','讲个笑话','聊聊天'];
  else if(h>=18&&h<22)r=['今天好累','我想你了','讲个笑话','明天怎么办'];
  else r=['睡不着','陪我聊聊','我想你了','明天要早起'];
  document.getElementById('quickReplies').innerHTML=r.map(x=>`<span class="quick-reply" onclick="quickSend('${x}')">${x}</span>`).join('');
}

function applyConfig(){
  document.getElementById('aiProvider').value=config.aiProvider||'tongyi';
  document.getElementById('apiKey').value=config.apiKey;
  document.getElementById('systemPrompt').value=config.systemPrompt;
  document.getElementById('charName').value=config.charName;
  document.getElementById('voiceSelect').value=config.voiceIndex||0;
  document.getElementById('charNameDisplay').textContent=config.charName;
  updateModels();
}
function updateModels(){
  const s=document.getElementById('model');s.innerHTML='';
  if((config.aiProvider||'tongyi')==='tongyi')s.innerHTML='<option value="qwen-plus">qwen-plus（推荐）</option><option value="qwen-turbo">qwen-turbo（快）</option><option value="qwen-max">qwen-max（最强）</option>';
  else s.innerHTML='<option value="deepseek-chat">deepseek-chat</option><option value="deepseek-reasoner">deepseek-reasoner</option>';
  s.value=config.model;
}
document.getElementById('aiProvider').addEventListener('change',function(){config.aiProvider=this.value;updateModels()});
function openSettings(){applyConfig();document.getElementById('settingsOverlay').classList.add('show')}
function closeSettings(){document.getElementById('settingsOverlay').classList.remove('show')}
function saveSettings(){
  config.aiProvider=document.getElementById('aiProvider').value;config.apiKey=document.getElementById('apiKey').value.trim();
  config.model=document.getElementById('model').value;config.systemPrompt=document.getElementById('systemPrompt').value.trim();
  config.charName=document.getElementById('charName').value.trim()||'小鹿';config.voiceIndex=document.getElementById('voiceSelect').value;
  document.getElementById('charNameDisplay').textContent=config.charName;localStorage.setItem('ai-companion-config',JSON.stringify(config));closeSettings();
}
function resetChat(){
  if(confirm('确定清空所有聊天记录吗？')){chatHistory=[];localStorage.removeItem('ai-companion-history');document.getElementById('chatArea').innerHTML='';closeSettings();
  setTimeout(()=>{const g=getGreeting();addMsg('ai',g);chatHistory.push({role:'assistant',content:g});saveHist()},500)}
}

function detectMood(t){
  if(/[哈嘻嘿lol]{3,}|开心|高兴|棒|厉害|太好了|谢谢|喜欢|爱|想你|抱/.test(t))return'happy';
  if(/[？?]{2,}|怎么|为什么|啥|什么|怎么搞|怎么办|是不是|真的吗/.test(t))return'thinking';
  if(/哼|切|嘁|略略|才不|笨蛋|傻瓜|讨厌/.test(t))return'playful';
  return'caring';
}
function updateMood(m){currentMood=m;document.querySelectorAll('.mood-bar span').forEach(s=>s.classList.remove('active-mood'));const e=document.getElementById('mood-'+m);if(e)e.classList.add('active-mood')}

function getApiUrl(){return config.aiProvider==='deepseek'?'https://api.deepseek.com/chat/completions':'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions'}

async function sendMessage(){
  const inp=document.getElementById('msgInput');const text=inp.value.trim();
  if(!text||isGenerating)return;if(!config.apiKey){openSettings();return}
  inp.value='';inp.style.height='auto';
  addMsg('user',text);chatHistory.push({role:'user',content:text});saveHist();
  const um=detectMood(text);
  if(um==='happy'){setFaceMood('happy');updateMood('happy')}else if(um==='thinking'){setFaceMood('thinking');updateMood('thinking')}else{setFaceMood('sad');updateMood('caring')}
  isGenerating=true;document.getElementById('sendBtn').disabled=true;setStatus('thinking');
  const now=new Date();
  const timeCtx=`当前时间：${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()]}`;
  try{
    const messages=[{role:'system',content:config.systemPrompt+'\n\n'+timeCtx},...chatHistory.slice(-30)];
    const apiUrl=getApiUrl();
    const res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${config.apiKey}`},body:JSON.stringify({model:config.model,messages,max_tokens:500,temperature:0.85,stream:true})});
    if(!res.ok)throw new Error('API错误 '+res.status);
    const reader=res.body.getReader();const decoder=new TextDecoder();
    let fullText='',bubbleDiv=null,buffer='';
    setStatus('speaking');setFaceMood('happy');
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const lines=buffer.split('\n');buffer=lines.pop();
      for(const line of lines){
        const trimmed=line.trim();if(!trimmed||!trimmed.startsWith('data:'))continue;
        const data=trimmed.slice(5).trim();if(data==='[DONE]')continue;
        try{const json=JSON.parse(data);const delta=json.choices?.[0]?.delta?.content;
        if(delta){fullText+=delta;if(!bubbleDiv)bubbleDiv=addMsg('ai','',true);
        bubbleDiv.innerHTML=esc(fullText)+'<span class="streaming-cursor"></span>';scrollBottom()}}catch(e){}
      }
    }
    if(bubbleDiv)bubbleDiv.innerHTML=esc(fullText)+' <span class="speak-btn" onclick="speakText(this.parentElement.textContent)">🔊</span>';
    if(!fullText)fullText='…嗯，走神了';
    chatHistory.push({role:'assistant',content:fullText});saveHist();
    const am=detectMood(fullText);updateMood(am);
    if(am==='happy')setFaceMood('happy');else if(am==='thinking')setFaceMood('thinking');else setFaceMood('idle');
    if(config.autoSpeak)speakText(fullText);
    setTimeout(()=>{if(!window.speechSynthesis||!speechSynthesis.speaking){setStatus('idle');setFaceMood('idle')}},8000);
  }catch(e){
    let msg=e.message;
    if(msg.includes('Failed to fetch')||msg.includes('Network')||msg.includes('Type'))msg='网络连接失败😣 试试去⚙️切换成通义千问';
    addMsg('ai',msg);setStatus('idle');setFaceMood('sad');setTimeout(()=>setFaceMood('idle'),3000);
  }
  isGenerating=false;document.getElementById('sendBtn').disabled=false;updateQuick();
}

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function addMsg(type,text,streaming=false){
  const area=document.getElementById('chatArea');const div=document.createElement('div');div.className='message '+type;
  if(type==='ai'){
    if(streaming)div.innerHTML='<span class="streaming-cursor"></span>';
    else div.innerHTML=esc(text)+' <span class="speak-btn" onclick="speakText(this.parentElement.textContent)">🔊</span>';
  }else div.textContent=text;
  area.appendChild(div);scrollBottom();return div;
}
function scrollBottom(){const a=document.getElementById('chatArea');requestAnimationFrame(()=>a.scrollTop=a.scrollHeight)}
function setStatus(s){const e=document.getElementById('charStatus');e.className='char-status';if(s==='thinking'){e.textContent='思考中...';e.classList.add('thinking')}else if(s==='speaking'){e.textContent='说话中...';e.classList.add('speaking')}else{e.textContent='在线 · 等你说话'}}
function saveHist(){localStorage.setItem('ai-companion-history',JSON.stringify(chatHistory))}
document.getElementById('msgInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});
document.getElementById('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
function startClock(){function u(){const n=new Date();document.getElementById('clock').textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0')}u();setInterval(u,10000)}

function drawFace(p){
  ctx.fillStyle='#000';ctx.fillRect(0,0,60,60);
  for(let y=0;y<12;y++)for(let x=0;x<12;x++){
    if(p[y][x]){
      let h,s,l;
      if(faceMood==='happy'||faceMood==='love'){h=330+Math.sin(faceFrame*0.06+x*0.3)*20;s=100;l=72}
      else if(faceMood==='thinking'){h=50+Math.sin(faceFrame*0.04+x*0.3)*15;s=100;l=68}
      else if(faceMood==='sad'){h=210+Math.sin(faceFrame*0.03+x*0.3)*10;s=80;l=60}
      else{h=180+Math.sin(faceFrame*0.05+x*0.3)*20;s=100;l=70}
      ctx.fillStyle=`hsl(${h},${s}%,${l}%)`;ctx.fillRect(x*5,y*5,4.5,4.5)
    }
  }
}
function setFaceMood(m){faceMood=m}
function startFace(){
  (function a(){
    faceFrame++;blinkTimer++;
    if(faceMood==='idle'&&blinkTimer>90&&blinkTimer<96)drawFace(F.blink);
    else if(faceMood==='happy'&&faceFrame%200<20)drawFace(F.love);
    else drawFace(F[faceMood]||F.idle);
    if(blinkTimer>96)blinkTimer=0;requestAnimationFrame(a)
  })();
}
